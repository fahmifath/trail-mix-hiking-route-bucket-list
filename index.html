<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trail Mix — Hiking Route Bucket List</title>
  <meta name="description" content="Catalog your dream hiking trails, track distance, difficulty, and completion status. Your personal outdoor bucket list." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Skip navigation -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Live region for screen-reader announcements -->
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Storage failure banner (hidden by default; role=alert + aria-live for dual announcement) -->
  <div id="storage-banner" role="alert" aria-live="assertive" hidden>
    <button id="dismiss-banner-btn" class="banner-dismiss" aria-label="Dismiss error message" type="button">✕</button>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <svg class="header-logo" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true" fill="none">
          <path d="M18 3 L33 30 H3 Z" fill="var(--color-forest)" opacity="0.9"/>
          <path d="M10 30 L20 12 L30 30" fill="var(--color-sage)" opacity="0.7"/>
          <circle cx="18" cy="28" r="2.5" fill="var(--color-earth)"/>
        </svg>
        <div>
          <h1 class="site-title">Trail Mix</h1>
          <p class="site-tagline">Your hiking bucket list</p>
        </div>
      </div>
      <!-- Summary Bar -->
      <div class="summary-bar" role="region" aria-label="Trail statistics">
        <div class="summary-stat">
          <span class="summary-value" id="summary-total">0</span>
          <span class="summary-label">Total Trails</span>
        </div>
        <div class="summary-divider" aria-hidden="true"></div>
        <div class="summary-stat">
          <span class="summary-value" id="summary-completed">0</span>
          <span class="summary-label">Completed</span>
        </div>
        <div class="summary-divider" aria-hidden="true"></div>
        <div class="summary-stat">
          <span class="summary-value" id="summary-distance">0 mi</span>
          <span class="summary-label">Distance Hiked</span>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-layout">
    <!-- Add / Edit Form Panel -->
    <aside class="form-panel" aria-label="Add or edit trail">
      <section aria-labelledby="form-heading">
        <h2 id="form-heading" class="panel-heading">Add a Trail</h2>
        <form id="trail-form" novalidate>
          <!-- Trail Name -->
          <div class="field-group">
            <label for="name" class="field-label">Trail Name <span class="required" aria-hidden="true">*</span></label>
            <input
              type="text"
              id="name"
              name="name"
              class="field-input"
              placeholder="e.g. Half Dome, Kalalau Trail"
              maxlength="100"
              autocomplete="off"
              aria-required="true"
              aria-describedby="name-error"
            />
            <span id="name-error" class="field-error" role="alert" aria-live="polite"></span>
          </div>

          <!-- Location -->
          <div class="field-group">
            <label for="location" class="field-label">Location <span class="required" aria-hidden="true">*</span></label>
            <input
              type="text"
              id="location"
              name="location"
              class="field-input"
              placeholder="e.g. Yosemite, Kauai"
              maxlength="100"
              autocomplete="off"
              aria-required="true"
              aria-describedby="location-error"
            />
            <span id="location-error" class="field-error" role="alert" aria-live="polite"></span>
          </div>

          <!-- Distance + Unit -->
          <div class="field-row">
            <div class="field-group field-group--grow">
              <label for="distance" class="field-label">Distance <span class="required" aria-hidden="true">*</span></label>
              <input
                type="number"
                id="distance"
                name="distance"
                class="field-input"
                placeholder="0.0"
                min="0.1"
                max="9999"
                step="0.1"
                aria-required="true"
                aria-describedby="distance-error"
              />
              <span id="distance-error" class="field-error" role="alert" aria-live="polite"></span>
            </div>
            <div class="field-group">
              <label for="unit" class="field-label">Unit</label>
              <select id="unit" name="unit" class="field-select">
                <option value="mi">mi</option>
                <option value="km">km</option>
              </select>
            </div>
          </div>

          <!-- Difficulty -->
          <div class="field-group">
            <label for="difficulty" class="field-label">Difficulty <span class="required" aria-hidden="true">*</span></label>
            <select id="difficulty" name="difficulty" class="field-select" aria-required="true" aria-describedby="difficulty-error">
              <option value="">— select —</option>
              <option value="easy">Easy</option>
              <option value="moderate">Moderate</option>
              <option value="hard">Hard</option>
              <option value="epic">Epic</option>
            </select>
            <span id="difficulty-error" class="field-error" role="alert" aria-live="polite"></span>
          </div>

          <!-- Status -->
          <div class="field-group">
            <label for="status" class="field-label">Status</label>
            <select id="status" name="status" class="field-select">
              <option value="want">Want to Hike</option>
              <option value="completed">Completed</option>
            </select>
          </div>

          <!-- Notes -->
          <div class="field-group">
            <label for="notes" class="field-label">Why it's on your list</label>
            <textarea
              id="notes"
              name="notes"
              class="field-textarea"
              placeholder="What calls you to this trail? Waterfalls? Summit views? A rite of passage?"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>

          <!-- Form actions -->
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Trail</button>
            <button type="button" id="cancel-edit-btn" class="btn btn-ghost" hidden>Cancel Edit</button>
          </div>
        </form>
      </section>
    </aside>

    <!-- Trail List Panel -->
    <section class="list-panel" aria-label="Your trail list">
      <!-- Search -->
      <div class="search-bar">
        <label for="search-input" class="sr-only">Search trails</label>
        <div class="search-wrap">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="search"
            id="search-input"
            class="field-input search-input"
            placeholder="Search by name, location, or notes…"
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Empty: no trails at all -->
      <div id="empty-all" class="empty-state" hidden>
        <svg class="empty-icon" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" fill="none">
          <path d="M32 8 L56 52 H8 Z" stroke="var(--color-sage)" stroke-width="3" fill="none"/>
          <path d="M20 52 L32 28 L44 52" stroke="var(--color-forest)" stroke-width="2.5" fill="none"/>
          <circle cx="32" cy="50" r="3" fill="var(--color-earth)"/>
        </svg>
        <h3 class="empty-title">No trails yet!</h3>
        <p class="empty-body">Every great adventure starts with a dream. Add your first trail using the form.</p>
      </div>

      <!-- Empty: filter returned no results -->
      <div id="empty-filter" class="empty-state" hidden>
        <svg class="empty-icon" width="48" height="48" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="var(--color-stone)" stroke-width="1.8">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="8" x2="14" y2="14"/><line x1="14" y1="8" x2="8" y2="14"/>
        </svg>
        <h3 class="empty-title">No trails match <span id="empty-filter-query"></span></h3>
        <p class="empty-body">Try a different search term, or <button id="clear-filter-btn" class="link-btn" type="button">clear the filter</button>.</p>
      </div>

      <!-- Trail cards -->
      <div id="trail-list" aria-label="Trail cards" role="list"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
